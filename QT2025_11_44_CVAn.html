<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Nhập liệu quyết toán - Chu Văn An</title>
<style>
body { font-family: Arial; padding:20px; }
input { display:block; margin:5px 0; padding:5px; width:300px; }
button { padding:10px 20px; margin-top:10px; }
#toast { position:fixed; bottom:20px; right:20px; color:#fff; padding:10px; display:none; }
#toast.show { display:block; }
</style>
</head>

<body>

<h2>Trường THPT Chu Văn An</h2>

<h3>Ngân sách</h3>
<input id="ns_dt_dau" placeholder="Dự toán đầu năm">
<input id="ns_dt_dc" placeholder="Điều chỉnh">
<input id="ns_dt_truoc" placeholder="Năm trước chuyển sang">
<input id="ns_qt_tx" placeholder="Quyết toán thường xuyên">
<input id="ns_qt_ktx" placeholder="Quyết toán không thường xuyên">

<h3>Thu dịch vụ</h3>
<input id="hp_th" placeholder="Học phí thực thu">
<input id="dv_th" placeholder="Dịch vụ thực thu">

<h3>Thông tin</h3>
<input id="nguoi_lap" placeholder="Người lập">
<input id="thu_truong" placeholder="Thủ trưởng">
<input id="ngay_lap" placeholder="Ngày lập">
<input id="sdt" placeholder="SĐT">
<input id="ghi_chu" placeholder="Ghi chú">

<button onclick="xuatJSON()">Gửi Sở</button>

<div id="toast"></div>

<script>

// ====== LINK APPS SCRIPT ======
var SHEETS_URL = 'https://script.google.com/macros/s/AKfycbxxvl2K82ZBWIcBrLLnnZKQng5v5UegS6epuTnt7vxk10T5YmkezXuYu7mggntkPYAZ7A/exec';

// ====== HÀM ======
function num(id){ return parseFloat(document.getElementById(id).value)||0; }
function text(id){ return document.getElementById(id).value || ''; }

function showToast(msg, err){
  let t = document.getElementById("toast");
  t.innerText = msg;
  t.style.background = err ? "red" : "green";
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),3000);
}

// ====== GỬI ======
function xuatJSON(){

  let dt_total = num('ns_dt_dau') + num('ns_dt_dc') + num('ns_dt_truoc');
  let qt_total = num('ns_qt_tx') + num('ns_qt_ktx');
  let thu_th = num('hp_th') + num('dv_th');

  if(!dt_total && !qt_total){
    showToast("Nhập số liệu trước!", true);
    return;
  }

  let payload = {
    don_vi: { ten: "Chu Văn An" },
    nguoi_lap: text('nguoi_lap'),
    thu_truong: text('thu_truong'),
    ngay_lap: text('ngay_lap'),
    sdt: text('sdt'),
    ghi_chu: text('ghi_chu'),
    ngan_sach:{
      dt_tong: dt_total,
      qt_tong: qt_total
    },
    tong_hop:{
      tong: qt_total + thu_th
    }
  };

  fetch(SHEETS_URL,{
    method:"POST",
    headers:{ "Content-Type":"text/plain" },
    body: JSON.stringify(payload)
  })
  .then(res=>res.json())
  .then(res=>{
    if(!res.ok) throw new Error("Lỗi gửi");
    showToast("✅ Gửi thành công!");
  })
  .catch(err=>{
    showToast("❌ Lỗi: "+err.message,true);
  });

}

</script>

</body>
</html>
