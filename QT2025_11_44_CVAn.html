<script>
// ── THÔNG TIN ĐƠN VỊ (được điền sẵn khi tạo file) ──
const DV = {
  stt: '11.44',
  name: 'Trường THPT Chu Văn An',
  type: 'Trường THPT',
  ma: 'CVAn'
};

// ── CẤU HÌNH GỬI GOOGLE SHEETS ──
var SHEETS_URL = 'https://script.google.com/macros/s/AKfycbxxvl2K82ZBWIcBrLLnnZKQng5v5UegS6epuTnt7vxk10T5YmkezXuYu7mggntkPYAZ7A/exec';

// ── HÀM PHỤ TRỢ ──
function set(id, val) {
  const el = document.getElementById(id);
  if (el) el.value = val !== 0 ? val : '';
}

function num(id) {
  const el = document.getElementById(id);
  return parseFloat(el?.value) || 0;
}

function textVal(id) {
  const el = document.getElementById(id);
  return (el?.value || '').trim();
}

function showToast(msg, isWarn) {
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.style.background = isWarn ? '#E65100' : '#2E7D32';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
}

// ── TÍNH TOÁN TỰ ĐỘNG ──
function recalc() {
  const dt_total = num('ns_dt_dau') + num('ns_dt_dc') + num('ns_dt_truoc');
  set('ns_dt_total', dt_total);

  const qt_total = num('ns_qt_tx') + num('ns_qt_ktx');
  set('ns_qt_total', qt_total);

  const can_doi = dt_total - qt_total - num('ns_chuyen') - num('ns_huy');
  set('ns_can_doi', can_doi);

  const hintEl = document.getElementById('hint-candoi');
  if (hintEl) {
    if (dt_total === 0) {
      hintEl.textContent = 'Nhập dự toán để kiểm tra';
      hintEl.style.color = '';
    } else if (Math.abs(can_doi) < 0.01) {
      hintEl.textContent = '✅ Cân đối hợp lệ!';
      hintEl.style.color = '#2E7D32';
    } else {
      hintEl.textContent = '⚠️ Chưa cân đối – kiểm tra lại';
      hintEl.style.color = '#C62828';
    }
  }

  const thu_kh = num('hp_kh') + num('dv_kh');
  const thu_th = num('hp_th') + num('dv_th');
  set('thu_kh_total', thu_kh);
  set('thu_th_total', thu_th);

  const fmt = v => v ? v.toLocaleString('vi-VN') : '—';
  document.getElementById('r-dt').textContent = fmt(dt_total);
  document.getElementById('r-qt').textContent = fmt(qt_total);

  const pct = dt_total > 0 ? (qt_total / dt_total * 100).toFixed(1) + '%' : '—';
  const pctEl = document.getElementById('r-pct');
  pctEl.textContent = pct;
  pctEl.className = 'val ' + (
    dt_total > 0
      ? (qt_total / dt_total >= 0.95 ? 'green' : qt_total / dt_total < 0.8 ? 'red' : '')
      : ''
  );

  document.getElementById('r-thu').textContent = fmt(thu_th);
  document.getElementById('r-tong').textContent = fmt(qt_total + thu_th);

  const cdEl = document.getElementById('r-cd');
  cdEl.textContent = dt_total > 0
    ? (Math.abs(can_doi) < 0.01 ? '✅ 0' : can_doi.toLocaleString('vi-VN'))
    : '—';
  cdEl.className = 'val ' + (
    dt_total > 0
      ? (Math.abs(can_doi) < 0.01 ? 'green' : 'red')
      : ''
  );

  const statusEl = document.getElementById('el-status');
  if (dt_total > 0 && qt_total > 0) {
    statusEl.textContent = '✅ Đã nhập liệu';
    statusEl.className = 'status ok';
    document.getElementById('step1').className = 'step done';
    document.getElementById('step2').className = 'step active';
  } else {
    statusEl.textContent = '⬜ Chưa nhập liệu';
    statusEl.className = 'status';
    document.getElementById('step1').className = 'step active';
    document.getElementById('step2').className = 'step';
  }
}

// ── GỬI DỮ LIỆU LÊN GOOGLE SHEETS ──
function xuatJSON() {
  const dt_total = num('ns_dt_dau') + num('ns_dt_dc') + num('ns_dt_truoc');
  const qt_total = num('ns_qt_tx') + num('ns_qt_ktx');
  const thu_th = num('hp_th') + num('dv_th');

  if (!dt_total && !qt_total) {
    showToast('Vui lòng nhập số liệu trước khi gửi!', true);
    return;
  }

  const payload = {
    _meta: {
      version: '1.0',
      created: new Date().toISOString(),
      form: 'qt_giaoduc_2025'
    },
    don_vi: {
      stt: DV.stt,
      ten: DV.name,
      loai: DV.type,
      ma: DV.ma
    },
    nguoi_lap: textVal('nguoi_lap'),
    thu_truong: textVal('thu_truong'),
    ngay_lap: textVal('ngay_lap'),
    sdt: textVal('sdt'),
    ghi_chu: textVal('ghi_chu'),
    ngan_sach: {
      dt_dau_nam: num('ns_dt_dau'),
      dt_dieu_chinh: num('ns_dt_dc'),
      dt_nam_truoc: num('ns_dt_truoc'),
      dt_tong: dt_total,
      qt_thuong_xuyen: num('ns_qt_tx'),
      qt_khong_tx: num('ns_qt_ktx'),
      qt_tong: qt_total,
      chuyen_nam_sau: num('ns_chuyen'),
      huy_bo: num('ns_huy'),
      can_doi: dt_total - qt_total - num('ns_chuyen') - num('ns_huy')
    },
    thu_dich_vu: {
      hoc_phi_kh: num('hp_kh'),
      hoc_phi_th: num('hp_th'),
      dv_khac_kh: num('dv_kh'),
      dv_khac_th: num('dv_th'),
      tong_kh: num('hp_kh') + num('dv_kh'),
      tong_th: thu_th
    },
    tong_hop: {
      tong_chi_ns_va_dv: qt_total + thu_th,
      ty_le_qt_dt_pct: dt_total > 0
        ? Math.round((qt_total / dt_total) * 10000) / 100
        : null
    }
  };

  showToast('Đang gửi dữ liệu lên Sở...', false);
  document.getElementById('step2').className = 'step done';
  document.getElementById('step3').className = 'step active';

  fetch(SHEETS_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'text/plain;charset=utf-8'
    },
    body: JSON.stringify(payload)
  })
    .then(function(res) {
      return res.json();
    })
    .then(function(json) {
      if (!json.ok) {
        throw new Error(json.message || 'Apps Script không trả về thành công');
      }

      luuTam();
      showToast('Đã gửi thành công lên Sở!');
      document.getElementById('step3').className = 'step done';
      document.getElementById('el-status').textContent = '✅ Đã nộp cho Sở';
      document.getElementById('el-status').className = 'status ok';
    })
    .catch(function(err) {
      console.error(err);
      showToast('Gửi không thành công: ' + err.message, true);
      document.getElementById('step3').className = 'step active';
    });
}

// ── LƯU TẠM ──
function luuTam() {
  const fields = [
    'ns_dt_dau','ns_dt_dc','ns_dt_truoc',
    'ns_qt_tx','ns_qt_ktx','ns_chuyen','ns_huy',
    'hp_kh','hp_th','dv_kh','dv_th',
    'nguoi_lap','ngay_lap','thu_truong','sdt','ghi_chu'
  ];

  const saved = {};
  fields.forEach(id => {
    saved[id] = document.getElementById(id)?.value || '';
  });

  localStorage.setItem('qt2025_' + DV.stt, JSON.stringify(saved));
  showToast('💾 Đã lưu tạm vào trình duyệt!');
}

function loadTam() {
  try {
    const saved = JSON.parse(localStorage.getItem('qt2025_' + DV.stt) || '{}');
    Object.keys(saved).forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = saved[id];
    });
    recalc();
  } catch (e) {
    console.error(e);
  }
}

function xoaDuLieu() {
  if (!confirm('Xóa toàn bộ dữ liệu đã nhập?')) return;

  const fields = [
    'ns_dt_dau','ns_dt_dc','ns_dt_truoc',
    'ns_qt_tx','ns_qt_ktx','ns_chuyen','ns_huy',
    'hp_kh','hp_th','dv_kh','dv_th',
    'nguoi_lap','ngay_lap','thu_truong','sdt','ghi_chu'
  ];

  fields.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });

  localStorage.removeItem('qt2025_' + DV.stt);
  recalc();
  showToast('🗑 Đã xóa dữ liệu!');
}

// ── KHỞI TẠO ──
loadTam();
recalc();
</script>
